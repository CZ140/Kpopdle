name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # Pure Node, no deps — fails fast on a malformed song catalog.
      - name: Validate song catalogs
        run: node scripts/validate-songs.js

      - name: Install dependencies
        run: npm run install:all

      # --- Blocking: these catch real regressions and pass today ----------
      - name: Server tests
        run: npm test --prefix server

      - name: Client tests
        run: npm test --prefix client

      - name: Client build
        run: npm run build --prefix client

      - name: Client lint
        run: npm run lint --prefix client

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm install --prefix client

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: client

      # pretest:e2e builds the client; the test then runs against `vite preview`
      # with every /api call mocked (no server, DB, or Deezer needed).
      - name: Run E2E tests
        run: npm run test:e2e --prefix client
